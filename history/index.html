<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新与完整历史 · 资费监控</title><link rel="stylesheet" href="../custom/style.css"><style>.history-list{display:grid;gap:18px}.run{background:var(--surface);padding:22px;border:1px solid var(--border);border-radius:12px}.run-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}.history-table{width:100%;border-collapse:collapse;font-size:12px}.history-table th,.history-table td{padding:10px;text-align:left;border-bottom:1px solid var(--border)}.history-table a,.archive-link{color:var(--accent);text-decoration:underline}.table-scroll{overflow:auto}.history-table{min-width:700px}.status-bad{color:var(--warn)}#legacy a{margin-right:18px}.history-toolbar{display:flex;gap:10px;align-items:center;margin:22px 0}.run-head small{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin:10px 0}summary{cursor:pointer}#detailBody h3{font-size:14px}</style></head><body><header><div class="header-inner"><a class="brand" href="../">资费监控</a><nav><a href="../custom/">我的资费</a><a class="active" href="./">更新历史</a><a href="../">四站入口</a></nav></div></header><main><div class="eyebrow">UPDATE ARCHIVE / 完整历史</div><div class="hero"><div><h1>每次更新，都有记录<span class="dot">.</span></h1><p>北京时间每天 00:00 和 12:00 触发采集；GitHub 排队可能延迟，页面在采集完成后发布。</p></div><a id="archiveRepo" class="button" target="_blank" rel="noopener noreferrer">完整归档分支 ↗</a></div><div class="notice" style="margin-top:24px">完整资费快照和变更明细压缩保存，不自动清理。接口异常时保留旧快照并记录状态，未接入的省份不算更新成功。</div><div id="legacy" class="panel"></div><div class="history-toolbar"><label for="year">年份</label><select id="year" aria-label="选择历史年份"></select><span id="count" role="status">正在载入…</span><button id="refresh">刷新记录</button></div><div id="runs" class="history-list" aria-live="polite"></div><div id="pager" class="pager"></div><footer>全国含移动、电信、联通、广电；省级范围与“我的资费”默认的 12 个组合一致。无变化也保留该轮运行记录，未变化的内容复用已存快照。<span>历史快照是当时公示记录，办理资格及有效期以官方信息为准。</span></footer></main><dialog id="detailDialog"><div class="dialog-head"><h2 id="detailTitle">完整变更明细</h2><button id="close" aria-label="关闭详情">×</button></div><div class="dialog-body" id="detailBody"></div></dialog><script src="../custom/model.js"></script><script src="app.js"></script></body></html>
