name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Mobile Fetch & Build", "Telecom & GB Fetch", "Unicom Fetch"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Verify code and data
        run: |
          python3 tests/test_diff.py
          python3 tests/test_final_regressions.py
          python3 -m unittest discover -s tests -p 'test_personal*.py' -v
          node tests/test_personal.js
          node --check custom/app.js
      - name: Build static artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare_pages.py --repo "$REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
