name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Scheduled Tariff Refresh", "Mobile Fetch & Build", "Telecom & GB Fetch", "Unicom Fetch"]
    types: [completed]
permissions:
  contents: read
  actions: read # Read this run's uploaded Pages artifact before deploying.
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'Scheduled Tariff Refresh' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Verify code and data
        run: |
          python3 tests/test_diff.py
          python3 tests/test_final_regressions.py
          python3 -m unittest discover -s tests -p 'test_personal*.py' -v
          python3 -m unittest discover -s tests -p 'test_scheduled*.py' -v
          python3 -m unittest discover -s tests -p 'test_announcements.py' -v
          node tests/test_personal.js
          node tests/test_tariff_areas.js
          python3 -B -m unittest discover -s tests -p test_wecom_areas.py -v
          node --check app.js
          node --check unicom/app.js
          node --check custom/app.js
      - name: Build static artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare_pages.py --repo "$REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: _pages
      - name: Wait for Pages artifact metadata
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          python3 -B - <<'PY'
          import json, os, time, urllib.request, urllib.error
          expected = os.environ["EXPECTED_ARTIFACT_ID"]
          if not expected.isdigit():
              raise SystemExit("Pages upload returned no valid artifact ID")
          url = (os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
                 + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "/artifacts?per_page=100")
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(request, timeout=min(10, max(1, deadline-time.monotonic()))) as response:
                      artifacts = json.load(response).get("artifacts", [])
                  if any(str(a.get("id")) == expected and a.get("name") == "github-pages"
                         and not a.get("expired") for a in artifacts):
                      print("Pages artifact metadata ready: " + expected)
                      break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (408, 429, 500, 502, 503, 504):
                      raise SystemExit("Cannot read Pages artifact metadata: HTTP " + str(exc.code))
                  print("Temporary artifact API error: HTTP " + str(exc.code))
              except (urllib.error.URLError, TimeoutError):
                  print("Temporary artifact API connection error")
              print("Waiting for this run's uploaded Pages artifact to become visible")
              time.sleep(min(5, max(0, deadline-time.monotonic())))
          else:
              raise SystemExit("Uploaded Pages artifact was not visible within 120 seconds")
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
