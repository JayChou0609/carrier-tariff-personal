name: WeCom Tariff Notifications

on:
  workflow_run:
    workflows: ["Scheduled Tariff Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "preview 仅预览；verify 验证云端文本/CSV并发送未提醒数据；send 正式推送"
        type: choice
        options: [preview, verify, send]
        default: preview

permissions:
  contents: read

concurrency:
  group: wecom-tariff-notifications
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  notify:
    if: >-
      github.repository == 'JayChou0609/carrier-tariff-personal' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only for hashed delivery checkpoints on wecom-notify-state.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify notification logic without credentials
        run: python3 -B -m unittest discover -s tests -p 'test_wecom*.py' -v
      - name: Send through Actions Secret
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'send' }}
        run: python3 -B scripts/wecom_cloud.py --action "$NOTIFY_ACTION"
      # Sanitized backup is generated before the checkpoint API write. It never
      # contains the webhook, key, GITHUB_TOKEN, configuration or data caches.
      - name: Preserve sanitized checkpoint after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wecom-checkpoint-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wecom-checkpoint-backup.json
          if-no-files-found: ignore
          retention-days: 7
